version: '3.8'

services:
  # =============================================
  # データベース
  # =============================================

  # PostgreSQL - リレーショナルデータベース
  postgres:
    image: postgres:16-alpine
    container_name: bench_postgres
    environment:
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpass
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - NoSQL ドキュメントDB
  mongodb:
    image: mongo:7.0
    container_name: bench_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: benchuser
      MONGO_INITDB_ROOT_PASSWORD: benchpass
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - インメモリキャッシュストア
  redis:
    image: redis:7.2-alpine
    container_name: bench_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # バックエンドサービス
  # =============================================

  # Node.js + Express API（ポート: 3001）
  nodejs-express:
    build:
      context: ./backend/nodejs
      dockerfile: Dockerfile
    container_name: bench_nodejs_express
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
    command: npm start

  # Go + Gin API（ポート: 3002）
  go-gin:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    container_name: bench_go_gin
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/bin/server

  # Python + FastAPI（ポート: 3003）
  python-fastapi:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: bench_python_fastapi
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
    command: python fastapi-fw/main.py
