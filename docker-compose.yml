# Docker Compose 設定ファイル
# 技術スタック比較用のベンチマーク環境
# 3つのバックエンドフレームワークと複数のデータベースをオーケストレーション

version: '3.8'

services:
  # ========== データベース ==========

  # PostgreSQL - リレーショナルデータベース
  # ACID準拠、複雑なクエリに対応、信頼性が高い
  postgres:
    image: postgres:16-alpine
    container_name: bench_postgres
    environment:
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpass
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    # ヘルスチェック: PostgreSQL が起動完了したことを確認
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - NoSQL ドキュメントデータベース
  # 柔軟なスキーマ、水平スケーリング対応
  mongodb:
    image: mongo:7.0
    container_name: bench_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: benchuser
      MONGO_INITDB_ROOT_PASSWORD: benchpass
      MONGO_INITDB_DATABASE: benchmark_db
    ports:
      - "27017:27017"
    # ヘルスチェック: MongoDB が起動完了したことを確認
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - インメモリキャッシュストア
  # 超高速なデータアクセス、セッション管理に最適
  redis:
    image: redis:7.2-alpine
    container_name: bench_redis
    ports:
      - "6379:6379"
    # ヘルスチェック: Redis が起動完了したことを確認
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== バックエンドサービス ==========

  # Node.js + Express API
  # JavaScript ランタイム、ノンブロッキングI/O、大きなエコシステム
  # ポート: 3001
  node-express:
    build:
      context: ./backend/node-express
      dockerfile: Dockerfile
    container_name: bench_node_express
    ports:
      - "3001:3000"
    # データベース起動後にこのサービスを開始
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    command: npm start

  # Go + Gin API
  # コンパイル言語、優れたパフォーマンス、組み込みの並行処理
  # ポート: 3002
  go-gin:
    build:
      context: ./backend/go-gin
      dockerfile: Dockerfile
    container_name: bench_go_gin
    ports:
      - "3002:3000"
    # データベース起動後にこのサービスを開始
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ./app

  # Python + FastAPI API
  # 最新の非同期フレームワーク、自動ドキュメント生成、高い開発効率
  # ポート: 3003
  python-fastapi:
    build:
      context: ./backend/python-fastapi
      dockerfile: Dockerfile
    container_name: bench_python_fastapi
    ports:
      - "3003:3000"
    # データベース起動後にこのサービスを開始
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1  # Python の標準出力をバッファしない設定
    command: uvicorn main:app --host 0.0.0.0 --port 3000

  # ========== ロードテストツール ==========

  # k6 - 負荷テストツール
  # 3つのバックエンドサービスのパフォーマンスを比較
  k6:
    image: grafana/k6:latest
    container_name: bench_k6
    volumes:
      # テストスクリプトをマウント
      - ./k6:/scripts
    # 全バックエンドサービスの起動を待機
    depends_on:
      - node-express
      - go-gin
      - python-fastapi
    environment:
      # テスト結果を JSON 形式で出力
      K6_OUT: json=results/results.json
