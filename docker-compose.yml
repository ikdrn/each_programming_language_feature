version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:16-alpine
    container_name: bench_postgres
    environment:
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpass
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: bench_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: benchuser
      MONGO_INITDB_ROOT_PASSWORD: benchpass
      MONGO_INITDB_DATABASE: benchmark_db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: bench_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Services
  node-express:
    build:
      context: ./backend/node-express
      dockerfile: Dockerfile
    container_name: bench_node_express
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    command: npm start

  go-gin:
    build:
      context: ./backend/go-gin
      dockerfile: Dockerfile
    container_name: bench_go_gin
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ./app

  python-fastapi:
    build:
      context: ./backend/python-fastapi
      dockerfile: Dockerfile
    container_name: bench_python_fastapi
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
    command: uvicorn main:app --host 0.0.0.0 --port 3000

  k6:
    image: grafana/k6:latest
    container_name: bench_k6
    volumes:
      - ./k6:/scripts
    depends_on:
      - node-express
      - go-gin
      - python-fastapi
    environment:
      K6_OUT: json=results/results.json
